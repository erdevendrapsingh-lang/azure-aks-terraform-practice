trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: "Test Azure Authentication"
    inputs:
      azureSubscription: "azure-aks-wif-practice"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      inlineScript: |
        echo "Testing Azure authentication..."
        az account show
        echo "Azure authentication successful!"
